<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mot de passe oublié — Vite & Gourmand</title>
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <header class="app-header">
        <nav class="nav" aria-label="Navigation principale">
            <a class="nav-brand" href="./index.html">Vite & Gourmand</a>
            <div class="nav-links">
                <a href="./index.html">Accueil</a>
                <a href="./menus.html">Menus</a>
                <a href="./contact.html">Contact</a>
                <a href="./login.html">Connexion</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Mot de passe oublié</h1>
            <p class="muted">Entre ton email. Si un compte existe, un lien de réinitialisation sera envoyé.</p>

            <form id="form">
                <label>Email
                    <input name="email" type="email" required autocomplete="email" />
                </label>

                <button class="btn primary" type="submit">Envoyer le lien</button>
                <p id="status" class="small muted" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="./forgot-password.js"></script>
</body>

</html>
