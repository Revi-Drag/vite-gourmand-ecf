<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mot de passe oublié — Vite & Gourmand</title>
    <link rel="stylesheet" href="./app.css" />
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">
        <div class="container">
            <a class="brand" href="./index.html">Vite & Gourmand</a>

            <nav class="nav">
                <a href="./index.html">Accueil</a>
                <a href="./menus.html">Menus</a>
                <a href="./contact.html">Contact</a>
                <a href="./login.html">Connexion</a>
            </nav>
        </div>
    </header>

    <main class="container auth">
        <div class="auth-wrap">

            <div class="auth-head">
                <h1 style="margin:0;">Mot de passe oublié</h1>
                <p class="muted" style="margin:10px 0 0;">
                    Entrez votre email.
                    Si un compte existe, un lien de réinitialisation sera envoyé.
                </p>
            </div>

            <form id="form" class="card auth-card">
                <label>
                    Email
                    <input name="email" type="email" required autocomplete="email" />
                </label>

                <button class="btn" type="submit">Envoyer le lien</button>

                <p id="status" class="small muted" role="status" aria-live="polite"></p>

                <hr class="sep" />

                <p class="small muted" style="margin:0;">
                    Si vous ne recevez rien, vérifiez vos courriers indésirables.
                </p>
            </form>

        </div>
    </main>

    <script src="./forgot-password.js"></script>
</body>

</html>
