<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vite & Gourmand — Connexion</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <div id="appHeader"></div>

    <main class="container auth">
        <div class="auth-wrap">
            <div class="auth-head">
                <h1 style="margin:0;">Connexion</h1>
                <p class="muted" style="margin:10px 0 0;">
                    Accédez à votre espace pour commander, suivre vos demandes et gérer vos informations.
                </p>

                <p class="small muted" style="margin:10px 0 0;">
                    <a href="./forgot-password.html">Mot de passe oublié ?</a>
                </p>
            </div>

            <form id="loginForm" class="card auth-card">
                <label>
                    Email
                    <input type="email" name="email" autocomplete="email" />
                </label>

                <label>
                    Mot de passe
                    <input type="password" name="password" autocomplete="current-password" />
                </label>

                <button type="submit" class="btn">Se connecter</button>
                <p id="loginMsg" class="msg"></p>

                <hr class="sep" />

                <p class="muted small" style="margin:0;">
                    En cas de souci de connexion, vérifiez votre email et votre mot de passe.
                </p>
            </form>
        </div>
    </main>

    <div id="appFooter"></div>

    <script type="module">
        import { loadLayout } from "./layout.js";
        loadLayout();
    </script>

    <script src="./login.js?v=3"></script>
</body>

</html>
