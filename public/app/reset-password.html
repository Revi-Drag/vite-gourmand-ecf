<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Réinitialiser le mot de passe — Vite & Gourmand</title>
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <header class="app-header">
        <nav class="nav" aria-label="Navigation principale">
            <a class="nav-brand" href="./index.html">Vite & Gourmand</a>
            <div class="nav-links">
                <a href="./index.html">Accueil</a>
                <a href="./menus.html">Menus</a>
                <a href="./contact.html">Contact</a>
                <a href="./login.html">Connexion</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Nouveau mot de passe</h1>

            <form id="form">
                <label>Nouveau mot de passe
                    <input name="password" type="password" required autocomplete="new-password" />
                </label>

                <p class="small muted">
                    10+ caractères, 1 majuscule, 1 minuscule, 1 chiffre, 1 spécial.
                </p>

                <button class="btn primary" type="submit">Mettre à jour</button>
                <p id="status" class="small muted" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="./reset-password.js"></script>
</body>

</html>
