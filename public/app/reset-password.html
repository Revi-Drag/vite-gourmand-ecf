<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Réinitialiser le mot de passe — Vite & Gourmand</title>
    <link rel="stylesheet" href="./app.css" />
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">
        <div class="container">
            <a class="brand" href="./index.html">Vite & Gourmand</a>

            <nav class="nav" aria-label="Navigation principale">
                <a href="./index.html">Accueil</a>
                <a href="./menus.html">Menus</a>
                <a href="./contact.html">Contact</a>
                <a href="./login.html">Connexion</a>
            </nav>
        </div>
    </header>

    <main class="container auth">
        <div class="auth-wrap">
            <div class="auth-head">
                <h1 style="margin:0;">Nouveau mot de passe</h1>
                <p class="muted" style="margin:10px 0 0;">
                    Choisissez un nouveau mot de passe sécurisé pour votre compte.
                </p>
            </div>

            <form id="form" class="card auth-card">
                <label>
                    Nouveau mot de passe
                    <input name="password" type="password" required autocomplete="new-password" minlength="10" />
                </label>

                <p class="small muted" style="margin:10px 0 0;">
                    10+ caractères, 1 majuscule, 1 minuscule, 1 chiffre, 1 spécial.
                </p>

                <button class="btn" type="submit" style="margin-top:12px;">Mettre à jour</button>
                <p id="status" class="small muted" role="status" aria-live="polite"></p>

                <hr class="sep" />

                <p class="small muted" style="margin:0;">
                    Si le lien a expiré, recommencez depuis “Mot de passe oublié”.
                </p>
            </form>
        </div>
    </main>

    <script src="./reset-password.js"></script>
</body>

</html>
