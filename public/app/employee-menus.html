<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espace Employé — Menus</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <header class="topbar">
        <div class="container row">
            <h1 class="brand-logo">Vite & Gourmand</h1>
            <nav class="nav">
                <a href="./employee-orders.html">Commandes</a>
                <a href="./employee-menus.html" aria-current="page">Menus</a>
                <a href="./menus.html">Vue publique</a>
                <a href="./login.html">Connexion</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Gestion des menus</h2>
            <p class="muted small">Créer, mettre à jour, activer/désactiver et ajuster le stock.</p>
            <p id="status" class="msg"></p>

            <hr class="sep" />

            <div class="row" style="gap:10px; flex-wrap:wrap;">
                <input id="searchInput" type="text" placeholder="Rechercher (titre / thème / régime)"
                    style="flex:1; min-width:220px;" />
                <select id="filterActive" style="min-width:160px;">
                    <option value="all">Tous</option>
                    <option value="active">Actifs</option>
                    <option value="inactive">Inactifs</option>
                </select>
                <button class="btn secondary" id="refreshBtn">Rafraîchir</button>
            </div>
        </section>

        <section class="card">
            <h2>Créer un menu</h2>

            <div class="grid-2">
                <label>
                    Titre
                    <input id="cTitle" type="text" placeholder="Ex: Menu Classique Bordeaux" />
                </label>

                <label>
                    Thème
                    <input id="cTheme" type="text" placeholder="Ex: Classique / Noël / Pâques" />
                </label>

                <label>
                    Régime
                    <input id="cRegime" type="text" placeholder="Ex: Vegan / Végétarien / Classique" />
                </label>

                <label>
                    Min personnes
                    <input id="cMinPersons" type="number" min="1" value="10" />
                </label>

                <label>
                    Prix de base (€ / pers)
                    <input id="cBasePrice" type="number" min="0" step="0.01" value="25.00" />
                </label>

                <label>
                    Stock
                    <input id="cStock" type="number" min="0" value="5" />
                </label>
            </div>

            <label>
                Description
                <textarea id="cDescription" rows="3" placeholder="Description du menu..."></textarea>
            </label>

            <label>
                Conditions
                <textarea id="cConditions" rows="2" placeholder="Ex: matériel fourni, allergènes, délais..."></textarea>
            </label>

            <div class="row" style="justify-content:flex-start; gap:10px;">
                <label style="display:flex; align-items:center; gap:8px; margin:0;">
                    <input id="cIsActive" type="checkbox" checked style="width:auto;" />
                    Actif (visible côté client)
                </label>
            </div>

            <div class="row" style="justify-content:flex-end; margin-top:10px;">
                <button class="btn" id="createBtn">Créer</button>
            </div>
        </section>

        <section>
            <div id="menusGrid" class="grid" style="grid-template-columns: 1fr; gap:12px;"></div>
        </section>
    </main>

    <script src="./employee-menus.js"></script>
</body>

</html>
