<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vite & Gourmand — Menus</title>

    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <!-- HEADER -->
    <header class="topbar">
        <div class="container">
            <a class="brand" href="./index.html">Vite & Gourmand</a>

            <nav class="nav">
                <a href="./index.html">Accueil</a>
                <a href="./menus.html" aria-current="page">Menus</a>
                <a href="./legal.html">Mentions légales</a>
                <a href="./cgv.html">CGV</a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <h1>Nos menus</h1>

        <!-- FILTRES -->
        <section class="card">
            <h2>Filtres</h2>

            <div class="grid-2">

                <!-- THEME -->
                <label>
                    Thème
                    <select id="fTheme">
                        <option value="">Tous</option>
                    </select>
                </label>

                <!-- REGIME -->
                <label>
                    Régime
                    <select id="fDiet">
                        <option value="">Tous</option>
                        <option value="NONE">Aucun</option>
                        <option value="VEGETARIAN">Végétarien</option>
                        <option value="HALAL">Halal</option>
                        <option value="GLUTEN_FREE">Sans gluten</option>
                    </select>
                </label>

                <!-- MIN PERSONS -->
                <label>
                    Nombre de personnes (minimum)
                    <input id="fMinPersons" type="number" min="1" placeholder="ex: 5" />
                </label>

                <!-- PRICE MIN -->
                <label>
                    Prix minimum (€)
                    <input id="fPriceMin" type="number" min="0" step="0.01" placeholder="ex: 50" />
                </label>

                <!-- PRICE MAX -->
                <label>
                    Prix maximum (€)
                    <input id="fPriceMax" type="number" min="0" step="0.01" placeholder="ex: 200" />
                </label>

                <!-- ACTIONS -->
                <div class="actions">
                    <button class="btn" id="btnApply">Appliquer</button>
                    <button class="btn secondary" id="btnReset">Réinitialiser</button>
                </div>

            </div>

            <p id="status" class="muted" role="status" aria-live="polite"></p>
        </section>

        <!-- GRID MENUS -->
        <section id="menusGrid" class="menus-grid"></section>
    </main>

    <!-- JS -->
    <script src="./menus.js"></script>
</body>

</html>
