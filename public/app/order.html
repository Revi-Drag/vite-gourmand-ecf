<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vite & Gourmand — Commander</title>
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
    <main class="container">
        <a class="btn" href="./menus.html">← Retour</a>

        <section class="card" style="margin-top:12px;">
            <h2>Commande</h2>
            <p id="menuInfo" class="muted">Chargement du menu…</p>

            <form id="orderForm" class="form">
                <div class="field">
                    <label for="eventAddress">Adresse de la prestation</label>
                    <input id="eventAddress" required placeholder="Adresse complète" />
                </div>

                <div class="field">
                    <label for="eventCity">Ville</label>
                    <input id="eventCity" required placeholder="Bordeaux / autre" />
                </div>

                <div class="field">
                    <label for="distanceKm">Distance (km) si hors Bordeaux</label>
                    <input id="distanceKm" type="number" min="0" step="0.1" placeholder="ex: 12.5" />
                    <small class="muted">Si ville = Bordeaux → laisse vide (0).</small>
                </div>

                <div class="field">
                    <label for="eventDate">Date & heure de livraison</label>
                    <input id="eventDate" type="datetime-local" required />
                </div>

                <div class="field">
                    <label for="eventPhone">GSM</label>
                    <input id="eventPhone" required placeholder="06..." />
                </div>

                <div class="field">
                    <label for="persons">Nombre de personnes</label>
                    <input id="persons" type="number" min="1" step="1" required />
                </div>

                <div class="card" style="margin-top:12px;">
                    <h3>Récap prix</h3>
                    <div id="priceBox" class="muted">—</div>
                </div>

                <div style="margin-top:12px; display:flex; gap:8px;">
                    <button class="btn" type="submit">Valider la commande</button>
                    <span id="status" class="muted"></span>
                </div>
            </form>
        </section>
    </main>

    <script src="./order.js"></script>
</body>

</html>
